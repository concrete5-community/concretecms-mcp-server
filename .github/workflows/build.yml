name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify OAuth session binding
        run: npm run verify:oauth
      - name: Verify security
        run: npm run verify:security
      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=moderate --dry-run
      - name: Install mcpb
        run: npm install -g @anthropic-ai/mcpb
      - name: Validate MCPB manifest.json
        run: npx mcpb validate manifest.json
      - name: Create MCPB file
        run: npx mcpb pack . concretecms-mcp-server.mcpb
      - name: Inspect MCPB file
        run: npx mcpb info concretecms-mcp-server.mcpb
