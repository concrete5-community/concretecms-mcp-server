<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Concrete CMS MCP Server</title>
    <style>
      :root {
        color-scheme: light dark;
        --border: light-dark(#d0d5dd, #3a3f47);
        --surface: light-dark(#ffffff, #1f2227);
        --accent: light-dark(#0b57d0, #8ab4f8);
        --on-accent: light-dark(#ffffff, #10151c);
        --danger: light-dark(#b3261e, #f2b8b5);
      }
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: light-dark(#f5f6f8, #15171a);
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
      }
      h2 {
        margin: 0;
        font-size: 1.125rem;
      }
      section {
        margin-bottom: 1rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--surface);
      }
      section > p {
        margin: 0.25rem 0 0;
        opacity: 0.75;
      }
      label {
        display: block;
        margin: 1rem 0 0.25rem;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem 0.625rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        font: inherit;
      }
      #user {
        max-width: 10rem;
      }
      .hint {
        margin: 0.25rem 0 0;
        font-size: 0.875rem;
        opacity: 0.75;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      button {
        padding: 0.5rem 0.875rem;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }
      button.danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      .result {
        margin-top: 1.25rem;
        padding: 0.75rem 1rem;
        border-left: 0.25rem solid var(--accent);
        background: light-dark(#f0f4fb, #262b33);
        overflow-wrap: anywhere;
      }
      .result:empty {
        display: none;
      }
      .result.error {
        border-left-color: var(--danger);
        color: var(--danger);
      }
      .result p {
        margin: 0;
      }
      .result a {
        display: block;
        margin: 0.5rem 0 0.75rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Concrete CMS MCP Server</h1>
      <section>
        <h2>Connector</h2>
        <p>Check that the connector is running.</p>
        <div class="buttons">
          <button type="button" id="health">Check the connector</button>
        </div>
        <div id="health-result" class="result" role="status"></div>
      </section>
      <section>
        <h2>Users</h2>
        <p>
          Manage the authorization of the Concrete CMS users that work with the AI agents through
          this connector.
        </p>
        <label for="key">Key for the AI agents</label>
        <input
          id="key"
          type="password"
          placeholder="MCP_API_KEY"
          autocomplete="off"
          spellcheck="false"
        />
        <label for="user">ID of the Concrete CMS user</label>
        <input id="user" type="number" min="1" step="1" />
        <p class="hint">Not needed with a personal key.</p>
        <div class="buttons">
          <button type="button" id="authorize" class="primary">Authorize</button>
          <button type="button" id="status">Check the authorization</button>
          <button type="button" id="revoke" class="danger">Revoke the authorization</button>
        </div>
        <div id="users-result" class="result" role="status"></div>
      </section>
    </main>
    <script>
      ;(() => {
        // The connector replaces this placeholder with its paths
        const paths = __PATHS__
        const key = document.getElementById('key')
        const user = document.getElementById('user')
        const healthResult = document.getElementById('health-result')
        const usersResult = document.getElementById('users-result')
        const buttons = Array.from(document.querySelectorAll('button'))

        function show(result, text, isError) {
          const paragraph = document.createElement('p')
          paragraph.textContent = text
          result.classList.toggle('error', Boolean(isError))
          result.replaceChildren(paragraph)
        }

        function showAddress(address) {
          show(
            usersResult,
            'The person to authorize must open this address in a browser within 10 minutes:'
          )
          const link = document.createElement('a')
          link.href = address
          link.target = '_blank'
          link.rel = 'noopener noreferrer'
          link.textContent = address
          const copy = document.createElement('button')
          copy.type = 'button'
          copy.textContent = 'Copy the address'
          copy.addEventListener('click', async () => {
            await navigator.clipboard.writeText(address)
            copy.textContent = 'Copied'
          })
          usersResult.append(link, copy)
        }

        function describeError(status, body) {
          switch (status) {
            case 401:
              return 'The key is not valid.'
            case 409:
              return 'A sign-in is already in progress for this user: use the address you already have, or try again in 10 minutes.'
            case 429:
              return 'Too many requests: try again in a minute.'
          }
          return body && body.error
            ? body.error
            : 'The server answered with the error ' + status + '.'
        }

        async function call(result, path, options, onSuccess) {
          const headers = { Accept: 'application/json' }
          let url = path
          if (!options.public) {
            if (key.value.trim() === '') {
              show(result, 'Enter the key.', true)
              key.focus()
              return
            }
            headers.Authorization = 'Bearer ' + key.value.trim()
            if (user.value !== '') {
              url += '?user_id=' + encodeURIComponent(user.value)
            }
          }
          buttons.forEach((button) => (button.disabled = true))
          try {
            const response = await fetch(url, {
              method: options.method || 'GET',
              headers,
              cache: 'no-store',
            })
            const body = await response.json().catch(() => null)
            if (response.ok && body) {
              onSuccess(body)
            } else {
              show(result, describeError(response.status, body), true)
            }
          } catch {
            show(result, 'The connector cannot be reached.', true)
          } finally {
            buttons.forEach((button) => (button.disabled = false))
          }
        }

        document.getElementById('health').addEventListener('click', () => {
          call(healthResult, paths.health, { public: true }, (body) => {
            if (body.status === 'healthy') {
              show(healthResult, 'The connector is running.')
            } else {
              show(healthResult, 'The connector answered with an unexpected status.', true)
            }
          })
        })

        document.getElementById('authorize').addEventListener('click', () => {
          call(usersResult, paths.start, {}, (body) => {
            const address = String(body.authorizationUrl)
            if (/^https?:/i.test(address)) {
              showAddress(address)
            } else {
              show(usersResult, 'The connector did not return a valid address.', true)
            }
          })
        })

        document.getElementById('status').addEventListener('click', () => {
          call(usersResult, paths.status, {}, (body) => {
            show(
              usersResult,
              'The user ' +
                body.userId +
                (body.authenticated ? ' is authorized.' : ' is not authorized.')
            )
          })
        })

        document.getElementById('revoke').addEventListener('click', () => {
          if (!confirm('Revoke the authorization?')) {
            return
          }
          call(usersResult, paths.revoke, { method: 'POST' }, (body) => {
            show(usersResult, 'The authorization of the user ' + body.userId + ' has been revoked.')
          })
        })
      })()
    </script>
  </body>
</html>
